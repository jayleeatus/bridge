name: Upstream Sync

# GITHUB_TOKEN cannot update workflow files (no workflows permission key).
# Sync code from upstream but keep this fork's .github/workflows/* unchanged
# so scheduled syncs no longer fail when upstream edits CI YAML.
permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes (exclude workflows)
        run: |
          set -euo pipefail
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git || true
          git fetch upstream main

          # Preserve this fork's workflow definitions across the sync.
          mkdir -p /tmp/bridge-workflows-backup
          cp -a .github/workflows/. /tmp/bridge-workflows-backup/

          if git merge-base --is-ancestor HEAD upstream/main && \
             [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/main)" ]; then
            echo "Already up to date with upstream/main"
            exit 0
          fi

          # Prefer a merge so local-only commits (if any) are kept.
          if ! git merge --no-edit upstream/main; then
            echo "[Error] Merge conflict while syncing upstream. Resolve via Sync fork UI."
            git merge --abort || true
            exit 1
          fi

          # Restore workflows so we never push upstream CI changes with GITHUB_TOKEN.
          mkdir -p .github/workflows
          rm -rf .github/workflows/*
          cp -a /tmp/bridge-workflows-backup/. .github/workflows/
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): keep fork workflows after upstream sync"
          fi

          git push origin main
          echo "Sync complete"
